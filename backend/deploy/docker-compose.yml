version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports: ["4222:4222"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexus-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      POSTGRES_DSN: postgres://nexus:nexus@postgres:5432/nexus?sslmode=disable
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: nexus
      S3_SECRET_KEY: nexus-secret
      JWT_SECRET: change-me-in-prod
      AUTHORIZED_TARGETS: 189.38.40.0/22
    depends_on: [postgres, nats, minio]
    ports: ["8080:8080"]

  ingestor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/ingestor"]
    environment:
      POSTGRES_DSN: postgres://nexus:nexus@postgres:5432/nexus?sslmode=disable
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: nexus
      S3_SECRET_KEY: nexus-secret
      JWT_SECRET: change-me-in-prod
      AUTHORIZED_TARGETS: 189.38.40.0/22
      INGESTOR_WORKERS: "24"
    depends_on: [postgres, nats]

volumes:
  pgdata:
  miniodata:
